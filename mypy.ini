[mypy]
# TODO(mypy-burndown): harness/tests/ has ~750 unannotated errors from dict shorthand
# and Pydantic runtime coercions. Excluded here to keep the core layer at 0 errors
# while a separate burndown PR (T2.1) adds strict annotations to test fixtures.
exclude = harness/tests/

# Optional third-party packages — ignore missing stubs/installs for these.
# boto3 and hvac are lazy-imported in credential_backends.py; they are not
# required for the core framework and may not be installed in dev environments.
[mypy-boto3.*]
ignore_missing_imports = True

[mypy-botocore.*]
ignore_missing_imports = True

[mypy-hvac.*]
ignore_missing_imports = True
