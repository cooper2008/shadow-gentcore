name: genesis_build
domain: _genesis
version: "2.0.0"
description: "Full genesis pipeline: scan → map → discover+context → design → build → validate"

steps:
  # Layer 1: Discovery
  - name: scan
    agent: _genesis/SourceScannerAgent/v1
    description: "Scan all knowledge sources, build inventory"
    gate:
      name: scan_gate
      condition: "status == success"
      on_fail: retry
      max_retries: 2

  # Layer 2: Classification
  - name: map
    agent: _genesis/KnowledgeMapperAgent/v1
    depends_on: [scan]
    description: "Classify discovered knowledge into framework categories"
    gate:
      name: map_gate
      # Coverage-aware gate. When the classifier honestly scored coverage
      # below 40/100 there isn't enough signal to generate a useful domain
      # — we fail here rather than let the architect assemble a thin
      # roster. Smoke/mock providers should score 0 or >40 depending on
      # fixture content; the genesis_test_provider fixture returns 85.
      condition: "status == success and output.coverage.overall >= 40"
      on_fail: retry
      max_retries: 1

  # Layer 2b: Conflict resolution (NEW — Gaps 1, 2)
  - name: resolve
    agent: _genesis/ConflictResolverAgent/v1
    depends_on: [map]
    description: "Arbitrate reference-vs-reference conflicts and group versioned docs"
    gate:
      name: resolve_gate
      # Pass-through is legitimate when no conflicts exist — the agent
      # emits contested_items: [] and resolved_knowledge_map mirrors the
      # input. Enforce only that resolution_summary was produced so we
      # know the step actually ran.
      condition: "status == success and output.resolution_summary is not empty"
      on_fail: degrade

  # Layer 3: Preparation (PARALLEL)
  - name: discover_tools
    agent: _genesis/ToolDiscoveryAgent/v1
    depends_on: [resolve]
    description: "Research needed tools and MCP servers"
    gate:
      name: tools_gate
      condition: "status == success"
      on_fail: degrade

  - name: engineer_context
    agent: _genesis/ContextEngineerAgent/v1
    depends_on: [resolve]
    description: "Generate quality context documents"
    gate:
      name: context_gate
      # Transformation step — quality-of-input is enforced at scan_gate;
      # quality-of-output at architect_gate (which verifies roster size).
      # Smoke/mock providers emit skeletal standards_md; keep this loose.
      condition: "status == success"
      on_fail: retry
      max_retries: 2

  # Layer 3a: Grounding verification (NEW — Gap 4)
  # Spot-checks a sample of claims in the freshly generated standards.md /
  # reference_chunks against the source files they cite. Has its own
  # file_read budget (cap 10). Failing the gate triggers the
  # verify_to_context feedback loop with unsupported_claims[] as payload.
  - name: verify
    agent: _genesis/ContextVerifierAgent/v1
    depends_on: [engineer_context]
    description: "Spot-check grounding of generated standards/reference chunks"
    gate:
      name: verify_gate
      # 0.7 is the plan's threshold. Smoke/mock runs with a single
      # advisory-only doc should sample 1 claim and score 1.0. Real
      # runs will start lower and tighten as ContextEngineer loops.
      condition: "status == success and output.grounding_score >= 0.7"
      on_fail: degrade

  # Layer 3c: Best-practice overlay (NEW — Tier 1.5)
  # Reads the freshly-generated standards.md + industry best-practice
  # library and writes `context/best_practices.md` — a gap-analysis
  # document that layers ON TOP of standards without modifying it.
  # Tier 1.5 preload (`best_practices_overlay`) injects it alongside
  # standards at agent-run time. No-op when no industry library exists
  # (advisor's own post_execute hook gracefully handles that path).
  - name: advise
    agent: _genesis/BestPracticeAdvisorAgent/v1
    depends_on: [engineer_context]
    description: "Write best_practices.md overlay when an industry library exists"
    gate:
      name: advise_gate
      # Permissive: any successful advisor completion passes. The
      # overlay is non-blocking — if the industry library is missing
      # or the advisor produces nothing actionable, we still want the
      # pipeline to continue. Only a hard error (status != success)
      # degrades.
      condition: "status == success"
      on_fail: degrade

  # Layer 3b: Close tool gaps surfaced by discover_tools. Wraps existing
  # public MCP servers when they match, or synthesizes new tool pack YAMLs
  # for gaps unique to the domain. Credentials flow up to Builder for
  # auto-propagation onto each agent's required_credentials.
  - name: synthesize_tools
    agent: _genesis/ToolSynthesizerAgent/v1
    depends_on: [discover_tools, map]
    description: "Synthesize new tool packs / MCP wrappers to close gaps"
    gate:
      name: synthesize_gate
      # Phase B: enforce the static security scan. Gate passes iff the
      # synthesis completed AND no `block`-severity findings were raised
      # against any emitted pack. `warn` and `info` findings surface in
      # the run record but don't stop the pipeline.
      condition: "status == success and output.security_scan.passed == true"
      on_fail: degrade

  # Layer 4: Design
  - name: architect
    agent: _genesis/AgentArchitectAgent/v2
    depends_on: [map, discover_tools, synthesize_tools, engineer_context, verify, advise]
    description: "Design agent roster, workflow DAG, tool assignments"
    gate:
      name: architect_gate
      # Coverage-aware, minimum-roster gate (Gap 5). Requires at least
      # 2 roster entries AND a valid DAG. Both fields are populated by
      # AgentArchitectAgent.v2's required `design_quality` block. Smoke
      # / mock providers that honestly emit ≥2 designs still pass.
      condition: "status == success and output.design_quality.agent_count >= 2 and output.design_quality.dag_valid == true"
      on_fail: retry
      max_retries: 1

  # Layer 5: Build
  - name: build
    agent: _genesis/AgentBuilderAgent/v1
    depends_on: [architect, engineer_context, discover_tools]
    description: "Create all domain files"
    gate:
      name: build_gate
      # Real file-write minimum enforced here (Gap 5). Builder's hooks.py
      # populates output.build_quality.files_written after each emit-then
      # -write pass. Three is the floor — a smoke run that writes one
      # agent + a workflow still falls below this, which is intended:
      # the smoke tier is for infrastructure verification, not real
      # domain generation.
      condition: "status == success and output.build_quality.files_written >= 3"
      on_fail: retry
      max_retries: 2

  # Layer 6: Validate
  - name: validate
    agent: _genesis/QualityGateAgent/v1
    depends_on: [build]
    description: "Comprehensive validation + dry-run"
    gate:
      name: validate_gate
      # Final quality gate (Gap 5). Verifies QualityGateAgent gave an
      # explicit pass. The grounding-score half of the plan is already
      # enforced upstream by verify_gate — checking it again here would
      # be redundant and would bury grounding regressions under a
      # validate retry loop. If ContextVerifier flagged under-grounded
      # claims, verify_to_context already looped back to
      # engineer_context before we ever got here.
      condition: "status == success and output.validation_passed == true"
      on_fail: retry
      max_retries: 2
      fallback_step: build

feedback_loops:
  - name: verify_to_context
    from_step: verify
    to_step: engineer_context
    # Triggers when ContextVerifierAgent judged the generated
    # standards/reference chunks to be under-grounded. The
    # unsupported_claims[] array ships back to ContextEngineer so it
    # can drop / re-cite the specific bad lines rather than regenerate
    # the whole document.
    #
    # NOTE — manifest_loader wraps this with `not`, so the yaml
    # `condition:` is the SUCCESS case (loop fires when it is False).
    # Mirrors the existing validate_to_build / validate_to_context
    # convention below.
    condition: "grounding_score >= 0.7"
    max_iterations: 2
    feedback_format: |
      Grounding check failed (score={grounding_score}).
      Unsupported claims to fix:
      {unsupported_claims}
      Either re-cite these claims with a real content_ref, or drop them.
      Keep the rest of standards.md intact.

  - name: validate_to_build
    from_step: validate
    to_step: build
    condition: "validate.validation_passed == false"
    max_iterations: 3
    feedback_format: |
      Files with issues:
      {validate.targeted_feedback}
      Fix ONLY these files.

  - name: validate_to_context
    from_step: validate
    to_step: engineer_context
    condition: "validate.issues.cross_reference is not empty"
    max_iterations: 1
    feedback_format: |
      Context gaps detected:
      {validate.issues.cross_reference}

reset_points:
  - map
  - architect
  - build

budget:
  max_tokens: 500000
  max_cost_usd: 25.0
  max_duration_seconds: 3600

ports:
  - name: sources_input
    direction: ingress
    schema:
      type: object
      required: [sources]
  - name: generated_domain
    direction: egress
    schema:
      type: object
      required: [domain_dir, validation_passed]

metadata:
  author: platform-team
  tags: [genesis, meta-agent, auto-generate, cross-industry]
