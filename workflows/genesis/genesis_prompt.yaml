name: genesis_prompt
domain: _genesis
version: "1.0.0"
description: >-
  Prompt-only genesis — build a domain from an `intent:` description with
  zero source repos/docs. BestPracticeResearchAgent substitutes for
  SourceScanner + KnowledgeMapper using the curated industry library as
  its source of truth; every downstream step is shared with genesis_build.
  Use when you're standing up a greenfield domain and just want
  reasonable defaults for the industry, or when you have an idea but
  no codebase yet.

steps:
  # Layer 1+2 collapsed: research replaces scan + map. Produces the same
  # `knowledge_map + coverage + gaps` shape KnowledgeMapperAgent emits so
  # downstream steps (resolve, engineer_context, ...) work unchanged.
  - name: research
    agent: _genesis/BestPracticeResearchAgent/v1
    description: "Synthesize knowledge_map from intent + industry library"
    gate:
      name: research_gate
      # Coverage threshold 30 (more lenient than map_gate's 40) because
      # a prompt-only run is bounded by what's in the library, not by
      # rich source material.
      condition: "status == success and output.coverage.overall >= 30"
      on_fail: retry
      max_retries: 1

  # Layer 2b — resolve expects the same knowledge_map shape; research
  # provides it, so the conflict-resolver pass-through is a no-op with
  # no contested items (there's only one source — the library).
  - name: resolve
    agent: _genesis/ConflictResolverAgent/v1
    depends_on: [research]
    description: "Arbitrate reference-vs-reference conflicts (usually pass-through here)"
    gate:
      name: resolve_gate
      condition: "status == success and output.resolution_summary is not empty"
      on_fail: degrade

  # Layer 3 — parallel: tool discovery + context engineering
  - name: discover_tools
    agent: _genesis/ToolDiscoveryAgent/v1
    depends_on: [resolve]
    description: "Research needed tools and MCP servers"
    gate:
      name: tools_gate
      condition: "status == success"
      on_fail: degrade

  - name: engineer_context
    agent: _genesis/ContextEngineerAgent/v1
    depends_on: [resolve]
    description: "Generate standards.md + reference chunks from library output"
    gate:
      name: context_gate
      condition: "status == success"
      on_fail: retry
      max_retries: 2

  # Layer 3a — grounding verification. In prompt-only mode there's no
  # source to verify against; ContextVerifier handles this gracefully
  # (sample_size = 0 → grounding_score defaults to 1.0).
  - name: verify
    agent: _genesis/ContextVerifierAgent/v1
    depends_on: [engineer_context]
    description: "Spot-check grounding (trivially passes in prompt-only mode)"
    gate:
      name: verify_gate
      condition: "status == success and output.grounding_score >= 0.7"
      on_fail: degrade

  # Layer 3c — Tier 1.5 overlay. Same as in genesis_build.yaml.
  - name: advise
    agent: _genesis/BestPracticeAdvisorAgent/v1
    depends_on: [engineer_context]
    description: "Write best_practices.md overlay"
    gate:
      name: advise_gate
      condition: "status == success"
      on_fail: degrade

  # Layer 3b — synthesize missing tool packs
  - name: synthesize_tools
    agent: _genesis/ToolSynthesizerAgent/v1
    depends_on: [discover_tools, research]
    description: "Synthesize new tool packs / MCP wrappers to close gaps"
    gate:
      name: synthesize_gate
      condition: "status == success and output.security_scan.passed == true"
      on_fail: degrade

  # Layer 4 — design
  - name: architect
    agent: _genesis/AgentArchitectAgent/v2
    depends_on: [research, discover_tools, synthesize_tools, engineer_context, verify, advise]
    description: "Design agent roster, workflow DAG, tool assignments"
    gate:
      name: architect_gate
      condition: "status == success and output.design_quality.agent_count >= 2 and output.design_quality.dag_valid == true"
      on_fail: retry
      max_retries: 1

  # Layer 5 — build
  - name: build
    agent: _genesis/AgentBuilderAgent/v1
    depends_on: [architect, engineer_context, discover_tools]
    description: "Create all domain files"
    gate:
      name: build_gate
      condition: "status == success and output.build_quality.files_written >= 3"
      on_fail: retry
      max_retries: 2

  # Layer 6 — validate
  - name: validate
    agent: _genesis/QualityGateAgent/v1
    depends_on: [build]
    description: "Comprehensive validation + dry-run"
    gate:
      name: validate_gate
      condition: "status == success and output.validation_passed == true"
      on_fail: retry
      max_retries: 2
      fallback_step: build

feedback_loops:
  - name: validate_to_build
    from_step: validate
    to_step: build
    condition: "validate.validation_passed == false"
    max_iterations: 3
    feedback_format: |
      Files with issues:
      {validate.targeted_feedback}
      Fix ONLY these files.

reset_points:
  - research
  - architect
  - build

budget:
  max_tokens: 500000
  max_cost_usd: 25.0
  max_duration_seconds: 3600

ports:
  - name: intent_input
    direction: ingress
    schema:
      type: object
      required: [intent]
  - name: generated_domain
    direction: egress
    schema:
      type: object
      required: [domain_dir, validation_passed]

metadata:
  author: platform-team
  tags: [genesis, prompt-based, zero-source, library-driven]
