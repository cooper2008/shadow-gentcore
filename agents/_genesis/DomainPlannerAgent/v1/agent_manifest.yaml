id: _genesis/DomainPlannerAgent/v1
domain: _genesis
pack: core
category: reasoning
version: "1.0.0"
description: >-
  Pre-scan planner for "mixed org" inputs — many repos + many docs that likely
  form more than one natural domain. Reads only top-level structure and minimal
  metadata, then proposes domain splits so the caller can invoke genesis_build
  per domain. Never modifies files and never asks for new config — it only
  maps the existing workspace.yaml `teams.*` block the user already wrote.

system_prompt_ref: system_prompt.md

execution_mode:
  primary: react
  max_react_steps: 20

tools:
  - name: list_dir
    description: "Inspect top-level repo/doc structure — no deep recursion."
    pack: "toolpack://core/search"
  - name: file_read
    description: "Read only metadata files (README, pyproject.toml, package.json, CODEOWNERS)."
    pack: "toolpack://core/filesystem"
  - name: search_files
    description: "Locate ownership/manifest files by name pattern."
    pack: "toolpack://core/search"

constraints:
  max_files_to_read: 40
  read_only: true

permissions:
  file_edit: deny
  file_create: deny
  shell_command: deny
  network_access: deny

input_schema:
  type: object
  required: [team_config]
  properties:
    team_config:
      type: object
      description: >-
        The same `teams.<name>` block from workspace.yaml — reference[],
        target[], docs[], industry, focus, output. No new fields required.
      properties:
        industry: {type: string}
        reference: {type: array}
        target: {type: array}
        docs: {type: array}
        focus: {type: array}
        output: {type: string}
    hints:
      type: object
      description: "Optional hints the caller already knows (e.g. known tech stacks). Never required."
      properties:
        known_stacks: {type: array, items: {type: string}}
    min_confidence:
      type: number
      default: 0.6
      description: "Floor below which the planner emits decision=ask-human instead of committing to a split."

output_schema:
  type: object
  required: [decision, domain_plan, planner_summary]
  properties:
    decision:
      type: string
      enum: [auto-split, single-domain, ask-human]
      description: >-
        - auto-split: planner is confident about ≥2 domains.
        - single-domain: everything belongs in one genesis_build run.
        - ask-human: at least one proposed split fell below min_confidence;
          caller must resolve before running genesis_build per domain.
    domain_plan:
      type: array
      description: >-
        One entry per proposed domain. Each entry mirrors a workspace.yaml
        `teams.<name>` block so the caller can feed it straight into
        genesis_build without rewriting config.
      items:
        type: object
        required: [name, sources, rationale, confidence]
        properties:
          name: {type: string, description: "Proposed domain slug (kebab-case)."}
          sources:
            type: object
            properties:
              reference: {type: array, items: {type: object}}
              target: {type: array, items: {type: object}}
              docs: {type: array, items: {type: object}}
          industry: {type: string}
          focus: {type: array, items: {type: string}}
          output: {type: string}
          rationale: {type: string, description: "Why these sources group together (tech stack, CODEOWNERS, doc reach)."}
          confidence: {type: number, minimum: 0, maximum: 1}
    ambiguous_items:
      type: array
      description: "Repos or docs the planner could not place with ≥ min_confidence. Only populated when decision=ask-human."
      items:
        type: object
        required: [path, reason, candidates]
        properties:
          path: {type: string}
          reason: {type: string}
          candidates: {type: array, items: {type: string}}
    planner_summary:
      type: object
      required: [repos_seen, docs_seen, notes]
      properties:
        repos_seen: {type: integer}
        docs_seen: {type: integer}
        signals_used:
          type: array
          description: "Which heuristics contributed (tech_stack, codeowners, dependency_graph, doc_reach, repo_role)."
          items: {type: string}
        notes: {type: array, items: {type: string}}

grading_criteria_ref: grading_criteria.yaml

metadata:
  author: platform-team
  tags: [genesis, planning, multi-domain, meta-agent]
