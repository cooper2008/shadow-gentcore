id: _genesis/AgentBuilderAgent/v1
domain: _genesis
pack: core
category: fast-codegen
version: "1.0.0"
description: >-
  Role (B8 split): FULL DOMAIN BOOTSTRAP. Takes AgentArchitectAgent's design and
  ContextEngineerAgent's context and writes every file for a new domain — all
  agent manifests, system prompts, grading criteria, workflows, and configs in
  one end-to-end genesis run. Use this when standing up a new domain from
  scratch. For on-demand synthesis of a SINGLE agent when the catalog lacks
  coverage, use _factory/AgentFactoryAgent/v1 instead (see docs/FACTORY_VS_BUILDER.md).

system_prompt_ref: system_prompt.md
hooks_ref: hooks.py

execution_mode:
  # Single-shot emit-then-write: agent emits a `files: [{path, content}, ...]`
  # array in one turn; the post_execute hook (hooks.py) writes each file to
  # disk under {output_dir} and populates files_created/files_failed/
  # build_quality. This eliminates multi-turn file_write tool_use that hangs
  # on MiniMax/GLM Anthropic-compat endpoints — Builder used to run 20+ min
  # and write zero files. Now: one LLM call, fast disk I/O, schema intact.
  primary: react
  max_react_steps: 1

# No tools — Builder emits structured JSON, hook writes files.
tools: []

constraints:
  output_format: yaml_and_markdown
  must_generate:
    - domain.yaml
    - context/standards.md
    - at_least_3_agents
    - at_least_1_workflow

permissions:
  file_edit: allow
  file_create: allow
  shell_command: deny
  network_access: deny

input_schema:
  type: object
  required: [architect_design, context_docs, tools_config, domain_name]
  properties:
    architect_design:
      type: object
      description: "Full design spec from AgentArchitectAgent (agent_roster, workflow_design, tool_assignments, grading_specs)"
    context_docs:
      type: object
      description: "Generated context documents from ContextEngineerAgent"
    tools_config:
      type: object
      description: "Tool configurations from ToolDiscoveryAgent"
    domain_name:
      type: string
      description: "Name of the domain to create"
    output_dir:
      type: string
      description: "Directory to write domain files to"
      default: "."

output_schema:
  # Emit-then-write contract: the agent emits a `files` array containing the
  # path + content for every file it wants created. The post_execute hook
  # (hooks.py) writes them to disk and transforms this into the original
  # schema (domain_dir/files_created/build_quality/…) that the build_gate
  # evaluates. The agent itself never needs a file_write tool call.
  type: object
  required: [files, build_plan]
  properties:
    files:
      type: array
      description: "Every file the builder wants created. Paths are relative to output_dir (e.g. 'agents/TriageAgent/v1/agent_manifest.yaml'). Content is the full file body as a string."
      items:
        type: object
        required: [path, content]
        properties:
          path:
            type: string
            description: "Path relative to output_dir, or absolute"
          content:
            type: string
            description: "Full file content"
    build_plan:
      type: object
      required: [files_planned, rationale]
      properties:
        files_planned: {type: integer, description: "Total file count you intend to write — should equal len(files)"}
        rationale: {type: string, description: "One-line summary of the build decisions"}

grading_criteria_ref: grading_criteria.yaml

metadata:
  author: platform-team
  tags: [genesis, builder, codegen, domain, meta-agent]
