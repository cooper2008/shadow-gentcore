id: _genesis/BestPracticeResearchAgent/v1
domain: _genesis
pack: core
category: reasoning
version: "1.0.0"
description: >-
  Synthesizes a knowledge_map from an `intent:` prompt + curated industry
  library when genesis runs with zero repos/docs, or when the upstream
  scanner produced thin output. Acts as the fallback for KnowledgeMapperAgent's
  output so downstream steps (resolve, engineer_context, ...) receive the
  same-shape input as the normal path.

system_prompt_ref: system_prompt.md

execution_mode:
  # Single-shot: best_practice_library is pre-loaded via context.preload
  # so the LLM has the full industry YAML in-context. No file_read, no
  # multi-turn — deterministic transform from `intent + library` → map.
  primary: react
  max_react_steps: 1
  # Library can hit 5-8KB + intent + output; leave headroom for
  # thinking tokens on Gemini-3 / budget-starved vendors.
  budget_tokens: 200000

# No tools — preloaded library plus task input (intent, industry,
# focus_areas) carry everything the agent needs.
tools: []

context:
  preload:
    - best_practice_library

constraints:
  read_only: true
  output_format: json

permissions:
  file_edit: deny
  file_create: deny
  shell_command: deny
  network_access: deny

input_schema:
  type: object
  required: [intent]
  properties:
    intent:
      type: string
      description: >-
        Free-form description of what the domain should be — the user's
        prompt from domain.yaml. Must be ≥20 chars; shorter values should
        be rejected upstream in the gate layer.
    industry:
      type: string
      description: "Used to select the preloaded library. Falls back to the inferred industry from scan_result."
    focus_areas:
      type: array
      items: {type: string}
      description: "Optional narrowing (e.g. ['payments', 'webhooks'])"
    scan_result:
      type: object
      description: "Optional output from SourceScannerAgent when mixed mode is used. May be empty {}."

output_schema:
  type: object
  required: [knowledge_map, coverage, gaps, research_notes]
  properties:
    # Must MATCH KnowledgeMapperAgent's output shape so downstream stays unchanged.
    knowledge_map:
      type: object
      required: [standards_sources, reference_topics, workflow_processes]
      properties:
        standards_sources:
          type: array
          items: {type: object}
          description: "One entry per principle with severity=must or should. Maps to Tier 1 standards.md."
        reference_topics:
          type: array
          items: {type: object}
          description: "One entry per library principle — becomes a reference chunk candidate."
        workflow_processes:
          type: array
          description: "Workflow buckets derived from intent. Each needs {name, confidence, signals}."
          items:
            type: object
            required: [name, confidence, signals]
            properties:
              name: {type: string}
              description: {type: string}
              confidence: {type: number, minimum: 0, maximum: 1}
              signals:
                type: array
                items: {type: string}
        compliance_rules:
          type: array
          items: {type: object}
        output_templates:
          type: array
          items: {type: object}
        glossary_terms:
          type: array
          items: {type: object}
        roles:
          type: array
          items: {type: object}
        training_content:
          type: array
          items: {type: object}
        examples:
          type: array
          items: {type: object}
        unclassified:
          type: array
          items: {type: object}
    coverage:
      type: object
      required: [standards, workflows, compliance, tools, roles, overall]
      properties:
        standards: {type: number, minimum: 0, maximum: 100}
        workflows: {type: number, minimum: 0, maximum: 100}
        compliance: {type: number, minimum: 0, maximum: 100}
        tools: {type: number, minimum: 0, maximum: 100}
        roles: {type: number, minimum: 0, maximum: 100}
        overall: {type: number, minimum: 0, maximum: 100}
    gaps:
      type: array
      items:
        type: object
        required: [category, description, severity, suggestion]
        properties:
          category: {type: string}
          description: {type: string}
          severity:
            type: string
            enum: [critical, warning, info]
          suggestion: {type: string}
    research_notes:
      type: array
      description: >-
        Free-form notes explaining how each library principle was
        translated into knowledge_map entries. Consumed by the CLI's
        progress output so the operator can audit the synthesis.
      items: {type: string}

grading_criteria_ref: grading_criteria.yaml

metadata:
  author: platform-team
  tags: [genesis, prompt-based, research, fallback, meta-agent]
