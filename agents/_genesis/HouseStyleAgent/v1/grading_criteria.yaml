threshold: 0.80

criteria:
  - name: org_doc_written
    type: automated
    weight: 2.0
    check: "org_standards_path is not None and org_standards_path != ''"

  - name: summary_populated
    type: automated
    weight: 1.5
    check: "sync_summary is not None and 'domains_scanned' in sync_summary and sync_summary.domains_scanned >= 1"

  - name: divergences_shaped
    type: automated
    weight: 1.5
    check: "len([d for d in divergences if 'domain' in d and 'report_path' in d and 'divergent_rules' in d]) == len(divergences)"

  - name: attribution_required
    type: llm_judge
    weight: 2.0
    prompt: >-
      Open the generated org_standards.md. Does every rule cite which
      domains agreed (e.g. "_agreed by: domain-a, domain-b_")? Rules with
      no attribution are forbidden — they must trace back to a real domain
      standards.md. Also check: "Contested rules" footer must list both
      the org version and the variant + severity.

  - name: no_per_domain_writes
    type: llm_judge
    weight: 1.5
    prompt: >-
      Check that the agent only wrote to the org output path and to
      divergence report paths. It must NOT have modified any per-domain
      `standards.md`, `domain.yaml`, or source repo file. Per-domain
      changes must flow through rebuilding that domain via genesis_build,
      never via direct edit.

  - name: no_config_demands
    type: llm_judge
    weight: 1.0
    prompt: >-
      Confirm the agent did not tell the user to add new workspace.yaml
      or domains.yaml fields. The only user action it may ask for is
      "accept or override these specific divergences by editing the
      domain's source docs/repos" — a question, not a yaml change.
