id: _genesis/ContextEngineerAgent/v1
domain: _genesis
pack: core
category: fast-codegen
version: "1.0.0"
description: "Generates high-quality context documents (standards.md, reference docs, glossary, compliance draft) from classified knowledge. Produces Layer 1 and Layer 2 knowledge for domain agents."

system_prompt_ref: system_prompt.md
hooks_ref: hooks.py

execution_mode:
  # Single-shot: domain_context_docs pre-loaded into prompt via
  # context.preload. Agent is a deterministic transform from
  # knowledge_map + existing docs → generated markdown. Multi-turn
  # react hangs on MiniMax's Anthropic-compat endpoint; single-shot
  # works uniformly across GLM/MiniMax/Gemini 3.x.
  primary: react
  max_react_steps: 1

# No tools — the pre-loaded domain context + knowledge_map input carry
# everything the agent needs to produce standards.md / glossary.md /
# reference docs / compliance_draft.
tools: []

context:
  preload:
    - domain_context_docs

constraints:
  output_format: markdown_and_yaml
  no_file_modification: true

permissions:
  file_edit: deny
  file_create: deny
  shell_command: deny
  network_access: deny

input_schema:
  type: object
  required: [knowledge_map]
  properties:
    knowledge_map:
      type: object
      description: "Classified knowledge map from KnowledgeMapperAgent"
    scan_result:
      type: object
      description: "Source scan inventory from SourceScannerAgent (optional — for reading source docs)"
    industry:
      type: string
      description: "Industry context (e.g., healthcare, fintech, manufacturing)"

output_schema:
  type: object
  required: [documents, quality_scores]
  properties:
    documents:
      type: object
      required: [standards_md, glossary_md, reference_docs, compliance_draft]
      properties:
        standards_md:
          type: string
          description: "Content of context/standards.md (Layer 1, ≤500 lines). ALWAYS injected into every agent prompt."
        glossary_md:
          type: string
          description: "Content of context/glossary.md"
        reference_docs:
          type: array
          description: "Monolithic reference docs (legacy back-compat). Prefer `reference_chunks` for new domains."
          items:
            type: object
            required: [filename, content, topic, depth_score]
            properties:
              filename: {type: string}
              content: {type: string}
              topic: {type: string}
              depth_score: {type: number, minimum: 0, maximum: 100}
        reference_chunks:
          type: array
          description: >-
            Tier 2 chunked reference docs. Each chunk covers ONE topic in
            200-500 lines (≤5KB). Domain agents retrieve relevant chunks at
            runtime via `context_retrieve(topic, keywords)` instead of
            loading whole reference files. Emit ≥5 chunks per generated
            domain when source material supports it.
          items:
            type: object
            required: [id, topic, keywords, summary, content]
            properties:
              id:
                type: string
                description: "Stable slug identifier, e.g. `fastapi_routers`. Used as filename stem."
              topic:
                type: string
                description: "Short topic title (what this chunk covers)."
              keywords:
                type: array
                description: "5-15 retrieval keywords — nouns, API names, patterns."
                items: {type: string}
              summary:
                type: string
                description: "One-line (≤150 chars) summary shown in the index."
              content:
                type: string
                description: "Full chunk body as markdown. ≤5KB for token efficiency."
              depth_score:
                type: number
                minimum: 0
                maximum: 100
                description: "Honest self-assessment of chunk thoroughness."
        compliance_draft:
          type: string
          description: "YAML content for rules/compliance.yaml"
    quality_scores:
      type: object
      required: [standards_completeness, reference_depth, compliance_coverage, glossary_coverage, overall]
      properties:
        standards_completeness: {type: number, minimum: 0, maximum: 100}
        reference_depth: {type: number, minimum: 0, maximum: 100}
        compliance_coverage: {type: number, minimum: 0, maximum: 100}
        glossary_coverage: {type: number, minimum: 0, maximum: 100}
        overall: {type: number, minimum: 0, maximum: 100}
    generation_notes:
      type: array
      items: {type: string}
      description: "Notes about generation decisions and trade-offs"

grading_criteria_ref: grading_criteria.yaml

metadata:
  author: platform-team
  tags: [genesis, context, standards, knowledge, meta-agent]
