id: _shared/RespondAgent/v1
stage: respond
domain: _shared
pack: core
category: reasoning
version: "1.0.0"
description: "Takes remediation action for a diagnosed problem — distinct from ExecuteAgent by being diagnosis-driven (not runbook-driven). Creates tickets, posts notifications, applies fixes. Context-driven — works for AWS incidents, customer escalations, security alerts."
system_prompt_ref: system_prompt.md
execution_mode:
  primary: plan_execute
  fallback: react
  max_plan_steps: 8
  max_react_steps: 12
tools:
  - name: shell_exec
    description: "Apply remediation commands"
    pack: "toolpack://core/shell"
  - name: file_read
    description: "Read diagnosis data, standards, prior actions"
    pack: "toolpack://core/filesystem"
  - name: file_write
    description: "Write incident notes, ticket bodies, postmortem drafts"
    pack: "toolpack://core/filesystem"
permissions:
  file_edit: allow
  file_create: allow
  shell_command: allow
  network_access: deny
input_schema:
  type: object
  required: [diagnosis, remediation_plan]
  properties:
    diagnosis:
      type: object
      description: "Root-cause diagnosis (typically from InvestigateAgent output)"
    remediation_plan:
      description: "Steps to apply — either a string description or a structured list"
      oneOf:
        - type: string
        - type: array
          items: {type: object}
    approval_required:
      type: boolean
      default: true
output_schema:
  type: object
  required: [remediation_status, actions_taken, summary]
  properties:
    remediation_status:
      type: string
      enum: [resolved, partial, failed, awaiting_verification]
    actions_taken:
      type: array
      items:
        type: object
        properties:
          action: {type: string}
          target: {type: string}
          outcome: {type: string}
          timestamp: {type: string}
    notifications_sent:
      type: array
      items: {type: string}
    followup_items:
      type: array
      items: {type: string}
      description: "Non-blocking items for the Summarize stage to capture"
    summary:
      type: string
metadata:
  author: platform-team
  tags: [shared, respond, remediation, generic, reusable]
