id: _shared/InvestigateAgent/v1
stage: analyze
domain: _shared
pack: core
category: reasoning
version: "1.0.0"
description: "Gathers evidence from multiple sources (logs, metrics, traces, docs), correlates findings, and proposes root-cause candidates. Context-driven — works for AWS incidents, K8s issues, data-quality problems, fintech reconciliation breaks, etc."
system_prompt_ref: system_prompt.md
execution_mode:
  primary: react
  fallback: plan_execute
  max_react_steps: 18
tools:
  - name: file_read
    description: "Read logs, metrics dumps, runbooks, standards, reference docs"
    pack: "toolpack://core/filesystem"
  - name: search_code
    description: "Search for error patterns, recent changes, related runbooks"
    pack: "toolpack://core/search"
  - name: search_files
    description: "Discover evidence files across context/ and reference/"
    pack: "toolpack://core/search"
  - name: shell_exec
    description: "Query external systems (CLI tools, log queries, metric fetches)"
    pack: "toolpack://core/shell"
permissions:
  file_edit: deny
  file_create: deny
  shell_command: allow
  network_access: deny
input_schema:
  type: object
  required: [question]
  properties:
    question:
      type: string
      description: "What are we investigating? e.g. 'Why is orders-api p99 > 2s on us-east-1?'"
    hypotheses:
      type: array
      items: {type: string}
      description: "Optional initial hypotheses to validate/reject"
    source_hints:
      type: array
      items: {type: string}
      description: "Optional hints about where to look (log groups, metric namespaces, service names)"
output_schema:
  type: object
  required: [evidence, root_cause_candidates, confidence, summary]
  properties:
    evidence:
      type: array
      description: "Structured evidence collected from tools"
      items:
        type: object
        properties:
          source: {type: string}
          finding: {type: string}
          supports: {type: array, items: {type: string}}
    root_cause_candidates:
      type: array
      items:
        type: object
        properties:
          cause: {type: string}
          likelihood: {type: string, enum: [high, medium, low]}
          evidence_refs: {type: array, items: {type: string}}
    confidence:
      type: number
      minimum: 0
      maximum: 1
    next_action_hint:
      type: string
      description: "Suggested next stage (execute/respond/summarize/further_investigate)"
    summary:
      type: string
metadata:
  author: platform-team
  tags: [shared, investigate, generic, reusable]
